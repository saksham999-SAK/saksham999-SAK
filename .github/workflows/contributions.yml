name: Update contribution graph

on:
  schedule:
    - cron: "30 18 * * *"   # daily, 00:00 IST
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    paths:
      - generate_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python generate_contributions.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          git diff --staged --quiet || git commit -m "Update contribution graph"
          git push
